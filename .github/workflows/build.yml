name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm --clean jektor.spec

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/Jektor/* -DestinationPath dist/Jektor-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jektor-portable
          path: dist/Jektor-portable.zip
